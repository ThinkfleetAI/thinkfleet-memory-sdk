// ─── Phase 5 cohort similarity ─────────────────────────────────────

message GetCohortRequest {
    Subject subject = 1;
    // How many nearest neighbors to return. Server clamps to [1, 50].
    uint32 k = 2;
    // Minimum similarity score (0.0..1.0) to include a member.
    // 0 = no cutoff (returns top-K regardless).
    double min_similarity = 3;
    optional string platform_id = 10;
    optional string project_id = 11;
}

message CohortMember {
    Subject subject = 1;
    double similarity = 2;
    // RFM segment label of the cohort member (e.g. "loyal_customer").
    // Lets the admin UI annotate the cohort list without a second
    // GetProfile round-trip per member.
    string rfm_segment = 3;
    // Pattern kinds active on this member — surfaces "Mike has the
    // same recurring_event + entity_preference as Sarah" annotation.
    repeated string pattern_kinds = 4;
}

message GetCohortResult {
    Subject target = 1;
    repeated CohortMember members = 2;
    // How many candidate subjects we scored before truncating to k.
    uint32 candidate_count = 3;
