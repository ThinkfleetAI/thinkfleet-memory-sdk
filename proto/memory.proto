    // Pass-through to GetCohort.
    double min_similarity = 4;
    optional string platform_id = 10;
    optional string project_id = 11;
}

message CohortPrediction {
    string pattern_kind = 1;
    string description = 2;
    string expected_at = 3;
    double confidence = 4;
    uint32 window_minutes = 5;
