    optional string source_pattern_id = 7;
    optional string emitted_by_pack = 8;
    string occurred_at = 9;
}

message EmitEventRequest {
    string event_type = 1;
    optional Subject subject = 2;
    // info | warn | critical. Defaults to "info" when blank.
    string severity = 3;
    string payload_json = 4;
    repeated string source_memory_ids = 5;
    optional string source_pattern_id = 6;
    optional string emitted_by_pack = 7;
    optional string platform_id = 10;
    optional string project_id = 11;
}

message EmitEventResult {
    // Empty when the dedupe collision suppressed the insert.
