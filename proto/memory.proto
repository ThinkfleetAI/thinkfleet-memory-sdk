}

// ─── Profile ────────────────────────────────────────────────────────

message GetProfileRequest {
    Subject subject = 1;
    optional string platform_id = 10;
    optional string project_id = 11;
}

// One risk signal active for the subject (declining_engagement,
// cant_lose_them RFM segment, long silence after a recurring cadence...).
message RiskIndicator {
    // Stable identifier: "declining_engagement", "rfm_cant_lose_them",
    // "cadence_missed", etc.
    string kind = 1;
    // Free-text explanation for the human dashboard.
    string description = 2;
    // 0..1 — how strongly the signal is firing.
    double severity = 3;
    // Pattern memory id that produced the signal (for provenance).
    string source_pattern_id = 4;
}

// Behavioral profile snapshot. The non-temporal "who is this
// subject" view, aggregated from their active behavior patterns.
message Profile {
    Subject subject = 1;
    // RFM segment label when an rfm_segment pattern is active.
    optional string rfm_segment = 2;
    optional uint32 recency_score = 3;
    optional uint32 frequency_score = 4;
    optional uint32 monetary_score = 5;
    // Subject's dominant entity (from entity_preference). Empty when
    // no preference pattern is active.
    optional string top_entity = 6;
    // Cadence summary when a temporal pattern is active.
    // "weekly", "every 14 days", "Fridays at 19:00", etc.
    optional string cadence_summary = 7;
    // Active risk signals — agents should surface these before
    // proceeding with non-trivial actions.
    repeated RiskIndicator risks = 8;
    // Ids of every active pattern that fed this profile (provenance).
    repeated string contributing_pattern_ids = 9;
    string generated_at = 10;
    uint64 duration_ms = 11;
}

// ─── Context bundle ─────────────────────────────────────────────────

message BuildContextRequest {
    Subject subject = 1;
    // Which sections to include. Empty = all five.
    repeated string include = 2;
    // Hard cap on bundle size. Sections truncate to fit. Default 2000.
    optional uint32 max_tokens = 3;
    optional uint32 memory_limit = 4;
    optional uint32 prediction_limit = 5;
    // Phase 3f min-necessary access — categories to drop from the
    // bundle. Used to keep medical / HR / PII memories out of
    // sales-context queries against the same project.
    repeated string exclude_categories = 6;
    optional string platform_id = 10;
    optional string project_id = 11;
}

message ContextProfileSummary {
    optional string rfm_segment = 1;
    optional uint32 recency_score = 2;
    optional uint32 frequency_score = 3;
    optional uint32 monetary_score = 4;
    optional string top_entity = 5;
    optional string cadence_summary = 6;
    repeated RiskIndicator risks = 7;
}

message ContextPattern {
    string id = 1;
    string pattern_kind = 2;
    string summary = 3;
    double confidence = 4;
    optional string next_expected_at = 5;
}

message ContextMemoryRow {
    string id = 1;
    string type = 2;
    string content = 3;
    double importance = 4;
    string created = 5;
}

message ContextObservationRow {
    string id = 1;
    string content = 2;
    uint32 proof_count = 3;
    repeated string source_memory_ids = 4;
    string created = 5;
}

message ContextProvenance {
    repeated string memory_ids = 1;
    repeated string pattern_ids = 2;
    repeated string observation_ids = 3;
}

message ContextBundle {
    Subject subject = 1;
    optional ContextProfileSummary profile = 2;
    repeated ContextPattern patterns = 3;
    repeated PredictedEvent predictions = 4;
    repeated ContextMemoryRow memories = 5;
    repeated ContextObservationRow observations = 6;
    ContextProvenance provenance = 7;
    uint32 tokens_estimate = 8;
    // Sections that were dropped or truncated to fit the budget.
    repeated string truncated = 9;
    string generated_at = 10;
    uint64 duration_ms = 11;
    // Ground-truth authority directive: place at the top of the prompt so the
    // model treats this memory as already-known and doesn't re-derive it.
    string guidance = 12;
}

// ─── Events ─────────────────────────────────────────────────────────

message MemoryEventRecord {
    string id = 1;
    string event_type = 2;
    optional Subject subject = 3;
    string severity = 4;             // "info" | "warn" | "critical"
    string payload_json = 5;          // free-form JSON
