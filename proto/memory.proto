    optional uint32 limit = 5;
    optional string platform_id = 10;
    optional string project_id = 11;
}

message AuditEventRecord {
    string id = 1;
    string created = 2;          // RFC3339
    string actor = 3;
    string event_type = 4;
    optional string query = 5;
    optional string memory_ids = 6;
