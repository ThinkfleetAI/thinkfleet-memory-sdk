    string generated_at = 7;
}

message GetCohortHealthRiskRequest {
    Subject subject = 1;
    optional uint32 k = 2;
    optional string platform_id = 10;
    optional string project_id = 11;
}

message CohortConditionRisk {
    string condition = 1;
    double cohort_prevalence = 2;
    uint32 cohort_size = 3;
    uint32 count_with = 4;
    double mean_similarity = 5;
    double confidence = 6;
    string rationale = 7;
}

message CohortHealthRisk {
    Subject subject = 1;
    uint32 cohort_size = 2;
    uint32 population_size = 3;
    repeated CohortConditionRisk risks = 4;
    string disclaimer = 5;
